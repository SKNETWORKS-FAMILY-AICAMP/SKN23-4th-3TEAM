version: '3.9'

services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./front/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: back/Dockerfile
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./vector_store:/app/vector_store
      - ./skin_ai:/app/skin_ai
      - ./ai:/app/ai
    entrypoint: >
      sh -c "ln -sf /app /app/back && uvicorn main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - chromadb

  chromadb:
    image: chromadb/chroma:latest
    expose:
      - "8001"
    volumes:
      - ./vector_store:/chroma/chroma