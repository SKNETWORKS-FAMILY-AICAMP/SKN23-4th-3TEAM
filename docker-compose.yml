version: '3.9'

services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./front/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: back/Dockerfile
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./vector_store:/app/vector_store
      - ./skin_ai:/app/skin_ai
      - ./ai:/app/ai
    depends_on:
      - chromadb

  chromadb:
    image: chromadb/chroma:latest
    expose:
      - "8001"
    volumes:
      - ./vector_store:/chroma/chroma